[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.119,<1", "uvicorn>=0.38,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.14,<1"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
